<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pho Vang - He thong nha hang</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="sidebar">
        <div class="brand">
          <span class="brand-mark">PV</span>
          <div>
            <strong>Pho Vang</strong>
            <span>Quan ly nha hang</span>
          </div>
        </div>

        <input id="apiBase" type="hidden" value="http://localhost:8080" />

        <nav class="role-nav" id="roleNav"></nav>

        <section class="user-panel">
          <span class="panel-label">Nguoi dung hien tai</span>
          <div id="currentUser" class="current-user">Khach vang lai</div>
          <button id="openLoginBtn" type="button">Dang nhap nhan vien</button>
          <button id="logoutBtn" class="ghost hidden" type="button">Dang xuat</button>
        </section>
      </header>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Pho Vang</p>
            <h1 id="pageTitle">Khach</h1>
          </div>
          <div class="connection">
            <span id="wsDot" class="dot"></span>
            <span id="wsStatus">WebSocket chua ket noi</span>
          </div>
        </header>

        <div id="toast" class="toast hidden"></div>

        <section id="customerView" class="view"></section>
        <section id="waiterView" class="view hidden"></section>
        <section id="cashierView" class="view hidden"></section>
        <section id="kitchenView" class="view hidden"></section>
        <section id="managerView" class="view hidden"></section>
        <section id="ownerView" class="view hidden"></section>
      </main>
    </div>

    <div id="loginModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="modal-card">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Nhan vien</p>
            <h2 id="loginTitle">Dang nhap</h2>
          </div>
          <button id="closeLoginBtn" class="ghost" type="button">Dong</button>
        </div>
        <div class="login-grid">
          <label class="field">
            <span>Username</span>
            <input id="username" placeholder="VD: staff" autocomplete="username" />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="password" type="password" placeholder="VD: staff123" autocomplete="current-password" />
          </label>
          <button id="loginBtn" type="button">Dang nhap</button>
        </div>
        <p class="login-note">Khach hang khong can dang nhap de xem menu va gui don.</p>
      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
